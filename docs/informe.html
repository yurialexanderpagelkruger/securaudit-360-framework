<style>
  :root {
    --ink: #f5f1e6;
    --dim: #b0a99a;
    --line: #2a2a31;
    --bg: #0d0d0f;
    --surface: #141417;
    --panel: #1c1c21;
    --high: #ff5252;
    --med: #ffb020;
    --low: #35c98a;
    --accent: #ffc107;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  [data-theme="light"] {
    --ink: #1a2233;
    --dim: #5a6b85;
    --line: #d9e0ea;
    --bg: #f5f7fb;
    --surface: #ffffff;
    --panel: #f7f9fc;
    --high: #d32f2f;
    --med: #c77c00;
    --low: #1e8a5a;
    --accent: #d99e00;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--bg); line-height: 1.65; transition: background 0.3s ease, color 0.3s ease; }
  .page { max-width: 900px; margin: 0 auto; background: var(--surface); padding: 60px 70px; box-shadow: var(--shadow); }
  header { border-bottom: 3px solid var(--accent); padding-bottom: 22px; margin-bottom: 34px; }
  .brand-line { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  h1 { font-size: 1.9rem; letter-spacing: -0.5px; }
  .meta { color: var(--dim); font-size: 0.85rem; font-family: Arial, sans-serif; text-align: right; }
  h2 { font-size: 1.15rem; margin: 34px 0 12px; border-left: 4px solid var(--accent); padding-left: 12px; }
  p { margin-bottom: 12px; font-size: 0.95rem; }
  .lead { color: var(--dim); }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
  .summary-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px; text-align: center; background: var(--panel); }
  .summary-box .n { font-size: 1.8rem; font-weight: 700; font-family: Arial, sans-serif; }
  .summary-box .l { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-family: Arial, sans-serif; }
  .n.high { color: var(--high); } .n.med { color: var(--med); } .n.low { color: var(--low); }
  table { width: 100%; border-collapse: collapse; margin: 18px 0; font-family: Arial, sans-serif; font-size: 0.82rem; }
  th, td { border: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
  th { background: var(--panel); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.8px; color: var(--accent); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.72rem; color: #0d0d0f; }
  .tag.alto { background: var(--high); color: #fff; }
  .tag.medio { background: var(--med); }
  .tag.bajo { background: var(--low); }
  .plan li { margin-bottom: 8px; font-size: 0.93rem; }
  footer { margin-top: 46px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--dim); font-family: Arial, sans-serif; }
  @media print { body { background: #fff; } .page { background: #fff; color: #1a2233; box-shadow: none; padding: 0; } th { color: #1a2233; background: #f5f7fb; } }
  @media (max-width: 640px) { .page { padding: 32px 22px; } .summary-grid { grid-template-columns: 1fr; } .meta { text-align: left; } }
</style>
